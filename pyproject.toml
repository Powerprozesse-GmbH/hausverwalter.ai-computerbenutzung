[project]
name = "hausverwalter-computer"
version = "0.2.0"
description = "Computer-Bedienung für Hausverwaltungen: Claude bedient Programme auf dem Mac oder Windows-PC, über hausverwalter.ai."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3,<3",
    "keyring>=25",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
    "mss>=9; sys_platform == 'win32'",
    "pillow>=10; sys_platform == 'win32'",
    "winrt-runtime>=2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=2; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=2; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=2; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Internal test providers: Claude on Bedrock/Vertex directly, GPT on Azure, TensorX.
intern = ["anthropic[bedrock,vertex]>=2.3,<3", "openai>=3", "boto3"]

[tool.uv]
package = false  # a folder of scripts, not an installable package
